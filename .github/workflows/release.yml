name: Build and Publish Docker Image

on:
  pull_request:
    branches:
      - develop
    types:
      - closed
  push:
    tags:
      - "*"
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    # Run when:
    # 1) PR into develop is closed AND merged (publish :latest)
    # 2) A git tag is pushed (publish :<tag>)
    # 3) A release is published (publish :<release-tag>)
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
         github.event.pull_request.merged == true &&
         github.event.pull_request.base.ref == 'develop') ||
        github.event_name == 'push' ||
        github.event_name == 'release'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR with custom token
        if: ${{ secrets.GHCR_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Log in to GHCR with GITHUB_TOKEN fallback
        if: ${{ secrets.GHCR_TOKEN == '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest only for merged PRs to develop
            type=raw,value=latest,enable=${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop' }}
            # tag push => same docker tag
            type=ref,event=tag
            # release publish => release tag
            type=ref,event=release

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
